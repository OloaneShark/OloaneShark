name: Rotate cassette artwork

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rotate cassette artwork
        run: python scripts/rotate_cassettes.py

      - name: Commit generated cassette changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cassettes/current-blacklight.png assets/cassettes/current-middleman.png assets/cassettes/current-spotify.png
          if git diff --cached --quiet; then
            echo "No cassette changes to commit."
          else
            git commit -m "Rotate cassette artwork"
            git push
          fi
